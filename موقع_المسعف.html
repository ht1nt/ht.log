<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>منظمة آمنون للإغاثة والتنمية — تسجيل الدخول</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-deep:#0A2540;
    --navy-mid:#123A5E;
    --sky-bright:#3E82B5;
    --paper:#F6F1E6;
    --paper-soft:#EFE8D8;
    --ink:#1C2430;
    --ink-soft:#5B6472;
    --amber:#E2842A;
    --amber-deep:#BE6714;
    --teal:#3E82B5;
    --line:rgba(28,36,48,0.14);
    --shadow:rgba(8,24,42,0.4);
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    min-height:100%;
    background:
      radial-gradient(60% 45% at 50% 0%, rgba(62,130,181,0.16), transparent 60%),
      radial-gradient(80% 60% at 50% 100%, rgba(18,58,94,0.35), transparent 60%),
      var(--navy-deep);
    font-family:'IBM Plex Sans Arabic', sans-serif;
    color:var(--ink);
  }

  body{
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:40px 18px 56px;
  }

  .screen{
    width:100%;
    max-width:400px;
  }

  /* ---- Badge clip ---- */
  .clip{
    width:64px;
    height:22px;
    margin:0 auto -1px;
    background:linear-gradient(180deg, var(--paper-soft), var(--paper));
    border:1px solid var(--line);
    border-bottom:none;
    border-radius:10px 10px 0 0;
    position:relative;
    z-index:2;
  }
  .clip::after{
    content:"";
    position:absolute;
    top:8px; left:50%;
    width:22px; height:6px;
    transform:translateX(50%);
    background:var(--navy-deep);
    border-radius:4px;
    opacity:.55;
  }

  /* ---- Badge card ---- */
  .card{
    position:relative;
    z-index:1;
    background:var(--paper);
    border-radius:6px 6px 26px 26px;
    box-shadow:0 24px 48px -18px var(--shadow), 0 1px 0 rgba(255,255,255,0.4) inset;
    padding:30px 26px 32px;
    border:1px solid var(--line);
  }

  /* ---- Mark + name ---- */
  .mark-row{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    margin-bottom:26px;
  }
  .mark{
    width:64px; height:64px;
    border-radius:50%;
    background:linear-gradient(160deg, var(--navy-mid), var(--navy-deep));
    display:flex;align-items:center;justify-content:center;
    margin-bottom:14px;
    box-shadow:0 8px 18px -6px rgba(15,32,54,0.55);
  }
  .mark svg{ width:34px; height:34px; }
  .pulse-line{
    stroke-dasharray:60;
    stroke-dashoffset:60;
    animation:draw 1.1s ease-out .2s forwards;
  }
  @keyframes draw{ to{ stroke-dashoffset:0; } }

  .org-name{
    font-family:'Tajawal', sans-serif;
    font-weight:800;
    font-size:24px;
    line-height:1.25;
    color:var(--ink);
    margin:0;
  }
  .org-sub{
    font-family:'Tajawal', sans-serif;
    font-weight:500;
    font-size:14.5px;
    color:var(--ink-soft);
    margin:2px 0 0;
  }
  .badge-rule{
    width:100%;
    display:flex;
    align-items:center;
    gap:6px;
    margin-top:16px;
  }
  .badge-rule span{
    height:1px;flex:1;
    background:repeating-linear-gradient(90deg, var(--line) 0 6px, transparent 6px 11px);
  }
  .badge-rule small{
    font-size:11.5px;
    color:var(--ink-soft);
    white-space:nowrap;
  }

  /* ---- Role toggle ---- */
  .role-toggle{
    display:flex;
    background:var(--paper-soft);
    border:1px solid var(--line);
    border-radius:12px;
    padding:4px;
    margin-top:22px;
    gap:4px;
  }
  .role-toggle button{
    flex:1;
    border:none;
    background:transparent;
    padding:11px 8px;
    font-family:'IBM Plex Sans Arabic', sans-serif;
    font-weight:600;
    font-size:14.5px;
    color:var(--ink-soft);
    border-radius:9px;
    cursor:pointer;
    transition:background .18s ease, color .18s ease, box-shadow .18s ease;
  }
  .role-toggle button.active{
    background:var(--amber);
    color:#fff;
    box-shadow:0 6px 14px -6px rgba(190,103,20,0.55);
  }

  /* ---- Fields ---- */
  .field{ margin-top:18px; }
  .field label{
    display:block;
    font-size:13.5px;
    font-weight:600;
    color:var(--ink);
    margin-bottom:7px;
  }
  .field-wrap{ position:relative; }
  .field input{
    width:100%;
    padding:13px 14px;
    padding-inline-end:42px;
    border-radius:10px;
    border:1.5px solid var(--line);
    background:#fff;
    font-family:'IBM Plex Sans Arabic', sans-serif;
    font-size:15px;
    color:var(--ink);
    outline:none;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .field input::placeholder{ color:#9AA2AD; }
  .field input:focus{
    border-color:var(--teal);
    box-shadow:0 0 0 3px rgba(46,110,99,0.15);
  }
  .icon-btn{
    position:absolute;
    inset-inline-end:6px;
    top:50%;
    transform:translateY(-50%);
    width:32px;height:32px;
    display:flex;align-items:center;justify-content:center;
    background:none;border:none;
    color:var(--ink-soft);
    cursor:pointer;
    border-radius:8px;
  }
  .icon-btn:hover{ color:var(--ink); background:var(--paper-soft); }
  .icon-btn svg{ width:19px;height:19px; }

  .forgot{
    display:block;
    text-align:start;
    margin-top:9px;
    font-size:12.5px;
    color:var(--teal);
    text-decoration:none;
    font-weight:600;
  }
  .forgot:hover{ text-decoration:underline; }

  .submit{
    width:100%;
    margin-top:22px;
    padding:14px;
    border:none;
    border-radius:11px;
    background:var(--amber);
    color:#fff;
    font-family:'IBM Plex Sans Arabic', sans-serif;
    font-weight:600;
    font-size:16px;
    cursor:pointer;
    box-shadow:0 10px 22px -10px rgba(190,103,20,0.65);
    transition:background .15s ease, transform .1s ease;
  }
  .submit:hover{ background:var(--amber-deep); }
  .submit:active{ transform:translateY(1px); }

  /* ---- Support panel ---- */
  .support{
    margin-top:14px;
  }
  .support-btn{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:12px;
    background:var(--navy-mid);
    border:1px solid rgba(255,255,255,0.09);
    border-radius:11px;
    color:rgba(246,241,230,0.9);
    font-family:'IBM Plex Sans Arabic', sans-serif;
    font-weight:600;
    font-size:14px;
    text-decoration:none;
    transition:background .15s ease, border-color .15s ease;
  }
  .support-btn svg{ width:16px;height:16px; flex:0 0 auto; color:var(--sky-bright); }
  .support-btn:hover{
    background:#17456F;
    border-color:rgba(255,255,255,0.16);
  }

  .footnote{
    text-align:center;
    margin-top:20px;
    font-size:11.5px;
    color:rgba(246,241,230,0.45);
  }

  /* ---- Toast ---- */
  #toast{
    position:fixed;
    left:50%;
    bottom:28px;
    transform:translateX(-50%) translateY(20px);
    background:var(--navy-deep);
    color:#fff;
    border:1px solid rgba(255,255,255,0.12);
    padding:13px 20px;
    border-radius:11px;
    font-family:'IBM Plex Sans Arabic', sans-serif;
    font-weight:600;
    font-size:14px;
    box-shadow:0 14px 30px -10px rgba(8,24,42,0.55);
    display:flex;
    align-items:center;
    gap:10px;
    z-index:50;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
    max-width:90vw;
  }
  #toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
    pointer-events:auto;
  }
  #toast.error{ border-inline-start:4px solid #E5484D; }
  #toast.success{ border-inline-start:4px solid #26C281; }
  #toast svg{ width:18px;height:18px;flex:none; }

  .submit[disabled]{
    opacity:.7;
    cursor:default;
  }
</style>
</head>
<body>

<div class="screen">

  <div class="clip"></div>

  <div class="card">
    <div class="mark-row">
      <div class="mark">
        <svg viewBox="0 0 48 48" fill="none">
          <path d="M24 6C15 10 8 12 8 12v14c0 11 8 15.5 16 17 8-1.5 16-6 16-17V12s-7-2-16-6Z"
                stroke="#F6F1E6" stroke-width="2.2" stroke-linejoin="round"/>
          <path class="pulse-line" d="M11 25h5l3-8 4 15 3-11 2 6h9"
                stroke="#E2842A" stroke-width="2.4" fill="none"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1 class="org-name">منظمة آمنون<br>للإغاثة والتنمية</h1>
      <p class="org-sub"></p>
      <div class="badge-rule"><span></span><small>تسجيل دخول المستخدم</small><span></span></div>
    </div>

    <div class="role-toggle" id="roleToggle">
      <button type="button" class="active" data-role="medic">مسعف</button>
      <button type="button" data-role="admin">مسؤول</button>
    </div>

    <form id="loginForm">
      <div class="field">
        <label for="userId">المعرف</label>
        <div class="field-wrap">
          <input id="userId" name="userId" type="text" placeholder="أدخل رقم المعرف" autocomplete="username" required>
        </div>
      </div>

      <div class="field">
        <label for="password">كلمة المرور</label>
        <div class="field-wrap">
          <input id="password" name="password" type="password" placeholder="أدخل كلمة المرور" autocomplete="current-password" required>
          <button type="button" class="icon-btn" id="togglePw" aria-label="إظهار كلمة المرور">
            <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
        <a href="#" class="forgot">نسيت كلمة المرور؟</a>
      </div>

      <button type="submit" class="submit">تسجيل الدخول</button>
    </form>

    <div class="support">
      <a class="support-btn" href="https://wa.me/9647811042889" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5Z"/>
        </svg>
        <span>تواصل مع الدعم</span>
      </a>
    </div>
  </div>

  <p class="footnote">منظمة آمنون للإغاثة والتنمية — جميع الحقوق محفوظة</p>
</div>

<div id="toast"></div>

<script>
  /* ====== إعدادات ====== */
  // نفس المفتاح المستخدم في لوحة التحكم (dashboard.html) لتخزين المستخدمين
  const USERS_STORAGE_KEY = 'users_data_v1';
  // مفتاح جلسة الدخول الحالية
  const SESSION_KEY = 'current_user_session_v1';

  // خرائط الأدوار بين واجهة تسجيل الدخول وبيانات المستخدم في اللوحة
  const ROLE_MAP = { medic: 'مسعف', admin: 'اداري' };

  // إلى أين يتم توجيه كل دور بعد نجاح الدخول
  // TODO: عدّل مسار صفحة المسعف عند تجهيزها (حالياً موضوعة كقيمة مؤقتة)
  const REDIRECT_BY_ROLE = {
    medic: 'medic.html',
    admin: 'dashboard.html'
  };

  /* ====== تبديل الدور ====== */
  let selectedRole = 'medic';
  const roleButtons = document.querySelectorAll('#roleToggle button');
  roleButtons.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      roleButtons.forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      selectedRole = btn.dataset.role;
    });
  });

  /* ====== إظهار/إخفاء كلمة المرور ====== */
  const pwInput = document.getElementById('password');
  const toggleBtn = document.getElementById('togglePw');
  toggleBtn.addEventListener('click', ()=>{
    const showing = pwInput.type === 'text';
    pwInput.type = showing ? 'password' : 'text';
    toggleBtn.setAttribute('aria-label', showing ? 'إظهار كلمة المرور' : 'إخفاء كلمة المرور');
  });

  /* ====== التوست ====== */
  let toastTimer = null;
  function showToast(message, type){
    const el = document.getElementById('toast');
    el.textContent = message;
    el.className = type === 'success' ? 'show success' : 'show error';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>{ el.classList.remove('show'); }, 3200);
  }

  /* ====== قراءة المستخدمين من نفس تخزين لوحة التحكم ====== */
  function loadUsers(){
    try{
      const raw = localStorage.getItem(USERS_STORAGE_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    return [];
  }

  /* ====== منطق تسجيل الدخول ====== */
  const form = document.getElementById('loginForm');
  const submitBtn = form.querySelector('.submit');

  form.addEventListener('submit', (e)=>{
    e.preventDefault();

    const userId = document.getElementById('userId').value.trim();
    const password = document.getElementById('password').value;

    if(!userId || !password){
      showToast('الرجاء تعبئة المعرف وكلمة المرور', 'error');
      return;
    }

    submitBtn.disabled = true;

    const users = loadUsers();
    const requiredRole = ROLE_MAP[selectedRole];

    // البحث عن مستخدم مطابق (بدون حساسية لحالة الأحرف في اسم المستخدم)
    const match = users.find(u =>
      (u.username || '').toLowerCase() === userId.toLowerCase() &&
      u.password === password
    );

    if(!match){
      submitBtn.disabled = false;
      showToast('المعرف أو كلمة المرور غير صحيحة', 'error');
      return;
    }

    if(match.status && match.status !== 'نشط'){
      submitBtn.disabled = false;
      showToast('هذا الحساب غير مُفعّل، تواصل مع الدعم', 'error');
      return;
    }

    if(match.role !== requiredRole){
      submitBtn.disabled = false;
      showToast('هذا الحساب لا يملك صلاحية الدخول بهذا الدور', 'error');
      return;
    }

    // حفظ جلسة الدخول (بدون كلمة المرور)
    try{
      sessionStorage.setItem(SESSION_KEY, JSON.stringify({
        id: match.id, name: match.name, username: match.username, role: match.role
      }));
    }catch(err){}

    showToast('تم تسجيل الدخول بنجاح، جارِ التحويل...', 'success');

    setTimeout(()=>{
      window.location.href = REDIRECT_BY_ROLE[selectedRole] || 'dashboard.html';
    }, 700);
  });
</script>

</body>
</html>
