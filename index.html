<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>متجري</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg:#0E0D13;
    --bg-raise:#161420;
    --card:#1B1826;
    --card-hover:#221E31;
    --line:#2E293D;
    --line-glow:#4A3F66;
    --gold:#E8B923;
    --gold-soft:#F3D577;
    --violet:#8B6CF2;
    --rose:#F2668B;
    --green:#25D366;
    --text:#F4F1F8;
    --text-muted:#948EA6;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  body{margin:0;}
  html,body{
    background:var(--bg);
    color:var(--text);
    font-family:'Tajawal',sans-serif;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  h1,h2,h3,.brand,.price{font-family:'Cairo',sans-serif;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  .wrap{max-width:1160px;margin:0 auto;padding:0 22px;}
  .hidden{display:none !important;}

  /* ---- Loading screen ---- */
  /* تم إلغاء واجهة التحميل: المتجر يظهر فوراً */

  /* ---- Top delivery strip ---- */
  .strip{
    background:linear-gradient(90deg,#151221,#1B1826 50%,#151221);
    border-bottom:1px solid var(--line);
    text-align:center;font-weight:700;font-size:13.5px;
    color:var(--gold-soft);padding:9px 12px;letter-spacing:.2px;
  }
  .strip .pulse{
    display:inline-block;width:7px;height:7px;border-radius:50%;
    background:var(--gold);margin-left:8px;animation:pulse 2s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.4;transform:scale(1.4);}}

  /* ---- Header ---- */
  header{
    position:sticky;top:0;z-index:30;padding:16px 0;
    background:rgba(14,13,19,.75);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
  }
  header .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;}
  .brand{font-size:24px;font-weight:900;color:var(--text);letter-spacing:.3px;}
  .brand span{
    background:linear-gradient(90deg,var(--gold),var(--gold-soft));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .header-actions{display:flex;align-items:center;gap:10px;}
  .cart-btn{
    position:relative;background:var(--card);border:1px solid var(--line);color:var(--text);
    padding:11px 20px;border-radius:999px;font-weight:700;font-size:14.5px;
    display:flex;align-items:center;gap:9px;
    transition:border-color .2s ease, transform .15s ease, box-shadow .2s ease;
  }
  .cart-btn:hover{border-color:var(--gold);box-shadow:0 0 0 4px rgba(232,185,35,.08);}
  .cart-btn:active{transform:scale(.97);}
  .cart-count{
    background:var(--rose);color:#fff;border-radius:999px;min-width:20px;height:20px;
    font-size:11.5px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px;
    transition:transform .2s ease;
  }
  .cart-count.bump{animation:bump .35s ease;}
  @keyframes bump{0%{transform:scale(1);}40%{transform:scale(1.4);}100%{transform:scale(1);}}
  .icon-btn{
    background:transparent;border:1px solid var(--line);color:var(--text-muted);
    width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:16px;transition:border-color .2s ease,color .2s ease;
  }
  .icon-btn:hover{border-color:var(--gold);color:var(--gold-soft);}

  /* ---- Hero carousel ---- */
  .hero{position:relative;margin-top:22px;border-radius:22px;overflow:hidden;border:1px solid var(--line);height:min(58vw,320px);min-height:220px;}
  .slide{position:absolute;inset:0;display:flex;align-items:center;padding:0 46px;opacity:0;transform:scale(1.04);transition:opacity .7s ease, transform 1.2s ease;pointer-events:none;}
  .slide.active{opacity:1;transform:scale(1);pointer-events:auto;}
  .slide::before{content:"";position:absolute;inset:0;z-index:0;}
  .slide[data-idx="0"]::before{background:radial-gradient(circle at 85% 20%, rgba(139,108,242,.55), transparent 55%),radial-gradient(circle at 15% 85%, rgba(232,185,35,.35), transparent 50%),linear-gradient(135deg,#1B1730,#100E19);}
  .slide[data-idx="1"]::before{background:radial-gradient(circle at 20% 25%, rgba(242,102,139,.45), transparent 55%),radial-gradient(circle at 80% 80%, rgba(232,185,35,.35), transparent 50%),linear-gradient(135deg,#251529,#100E19);}
  .slide[data-idx="2"]::before{background:radial-gradient(circle at 75% 30%, rgba(232,185,35,.5), transparent 55%),radial-gradient(circle at 25% 80%, rgba(139,108,242,.3), transparent 50%),linear-gradient(135deg,#191428,#100E19);}
  .slide-content{position:relative;z-index:1;max-width:480px;}
  .slide-eyebrow{font-size:13px;color:var(--gold-soft);font-weight:700;margin-bottom:10px;}
  .slide h2{font-size:clamp(22px,3.4vw,32px);margin:0 0 10px;color:#fff;}
  .slide p{color:rgba(244,241,248,.75);font-size:15px;margin:0;max-width:40ch;}
  .hero-dots{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:2;}
  .hero-dots button{width:8px;height:8px;border-radius:50%;background:rgba(244,241,248,.3);border:none;padding:0;transition:background .2s ease, width .2s ease;}
  .hero-dots button.active{background:var(--gold);width:22px;border-radius:5px;}
  .hero-arrow{position:absolute;top:50%;transform:translateY(-50%);background:rgba(244,241,248,.1);border:1px solid rgba(244,241,248,.2);color:#fff;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;z-index:2;backdrop-filter:blur(6px);transition:background .2s ease;}
  .hero-arrow:hover{background:rgba(244,241,248,.22);}
  .hero-arrow.prev{right:16px;}
  .hero-arrow.next{left:16px;}

  /* ---- Trust badges ---- */
  .trust{display:flex;gap:14px;flex-wrap:wrap;padding:22px 0 4px;}
  .trust-item{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:13.5px;color:var(--text-muted);}
  .trust-item b{color:var(--text);font-weight:700;}
  .trust-item .ic{font-size:18px;}

  /* ---- Category pills ---- */
  .cats{display:flex;gap:10px;padding:26px 0 4px;overflow-x:auto;scrollbar-width:none;}
  .cats::-webkit-scrollbar{display:none;}
  .cat-pill{flex:0 0 auto;background:transparent;border:1px solid var(--line);color:var(--text-muted);padding:9px 20px;border-radius:999px;font-size:14px;font-weight:500;transition:all .2s ease;}
  .cat-pill.active{border-color:transparent;color:#0E0D13;background:linear-gradient(90deg,var(--gold),var(--gold-soft));font-weight:700;}
  .cat-pill:not(.active):hover{border-color:var(--line-glow);color:var(--text);}

  /* ---- Product grid ---- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px;padding:24px 0 64px;}
  .card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;opacity:0;transform:translateY(14px);animation:rise .5s ease forwards;transition:border-color .25s ease, transform .25s ease, box-shadow .25s ease, background .25s ease;}
  .card:hover{border-color:var(--line-glow);transform:translateY(-4px);box-shadow:0 16px 34px -18px rgba(0,0,0,.6), 0 0 0 1px rgba(232,185,35,.08);background:var(--card-hover);}
  @keyframes rise{to{opacity:1;transform:translateY(0);}}
  .card-media{position:relative;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;font-size:56px;overflow:hidden;cursor:pointer;}
  .card-media::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 30%, rgba(139,108,242,.35), transparent 60%), radial-gradient(circle at 75% 75%, rgba(232,185,35,.28), transparent 55%), #201C2E;}
  .card-media span{position:relative;z-index:1;filter:drop-shadow(0 6px 14px rgba(0,0,0,.4));transition:transform .3s ease;}
  .card:hover .card-media span{transform:scale(1.08) rotate(-3deg);}
  .card-media img{position:relative;z-index:1;width:100%;height:100%;object-fit:cover;transition:transform .3s ease;}
  .card:hover .card-media img{transform:scale(1.06);}
  .card-name{cursor:pointer;}
  .badge{position:absolute;top:10px;right:10px;z-index:2;font-size:11.5px;font-weight:800;padding:5px 10px;border-radius:999px;color:#0E0D13;}
  .badge.sale{background:linear-gradient(90deg,var(--rose),#F79FB8);}
  .badge.new{background:linear-gradient(90deg,var(--gold),var(--gold-soft));}
  .card-body{padding:15px 16px 17px;display:flex;flex-direction:column;gap:5px;flex:1;}
  .card-cat{font-size:11.5px;color:var(--text-muted);}
  .card-name{font-size:15.5px;font-weight:700;margin:0;}
  .card-bottom{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding-top:10px;}
  .price{color:var(--gold-soft);font-weight:800;font-size:16px;}
  .price .old{color:var(--text-muted);font-weight:500;font-size:12.5px;text-decoration:line-through;margin-inline-start:6px;}
  .add-btn{position:relative;background:var(--gold);color:#0E0D13;border:none;padding:9px 16px;border-radius:9px;font-weight:800;font-size:13.5px;overflow:hidden;transition:background .2s ease, transform .12s ease;}
  .add-btn:hover{background:var(--gold-soft);}
  .add-btn:active{transform:scale(.94);}

  /* ---- Toast ---- */
  .toast-stack{position:fixed;bottom:22px;left:22px;z-index:170;display:flex;flex-direction:column;gap:10px;}
  .toast{background:var(--card);border:1px solid var(--line-glow);color:var(--text);padding:12px 18px;border-radius:11px;font-size:13.5px;font-weight:600;box-shadow:0 12px 26px -14px rgba(0,0,0,.6);display:flex;align-items:center;gap:9px;animation:toastIn .25s ease, toastOut .3s ease 1.7s forwards;}
  @keyframes toastIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  @keyframes toastOut{to{opacity:0;transform:translateY(-6px);}}

  /* ---- Cart drawer ---- */
  .overlay{position:fixed;inset:0;background:rgba(6,5,10,.65);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .25s ease;z-index:40;}
  .overlay.open{opacity:1;pointer-events:auto;}
  .drawer{position:fixed;top:0;bottom:0;left:0;width:min(390px,92vw);background:var(--bg-raise);border-right:1px solid var(--line);transform:translateX(-100%);transition:transform .3s cubic-bezier(.22,.9,.35,1);z-index:50;display:flex;flex-direction:column;}
  .drawer.open{transform:translateX(0);}
  .drawer-head{padding:22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
  .drawer-head h2{margin:0;font-size:19px;}
  .close-btn{background:none;border:none;color:var(--text-muted);font-size:20px;line-height:1;transition:color .15s ease;}
  .close-btn:hover{color:var(--text);}
  .drawer-items{flex:1;overflow-y:auto;padding:8px 22px;}
  .empty-cart{color:var(--text-muted);text-align:center;padding:50px 10px;font-size:14.5px;}
  .empty-cart .ic{font-size:34px;display:block;margin-bottom:10px;}
  .line-item{display:flex;align-items:center;gap:12px;padding:15px 0;border-bottom:1px solid var(--line);}
  .line-media{width:46px;height:46px;border-radius:10px;background:radial-gradient(circle at 30% 30%, rgba(139,108,242,.35), transparent 60%), #201C2E;display:flex;align-items:center;justify-content:center;font-size:20px;flex:0 0 auto;}
  .line-info{flex:1;min-width:0;}
  .line-info .n{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .line-info .p{color:var(--text-muted);font-size:12.5px;}
  .qty{display:flex;align-items:center;gap:7px;}
  .qty button{width:25px;height:25px;border-radius:7px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:14px;transition:border-color .15s ease;}
  .qty button:hover{border-color:var(--gold);}
  .remove-x{background:none;border:none;color:var(--text-muted);font-size:15px;margin-right:2px;transition:color .15s ease;}
  .remove-x:hover{color:var(--rose);}
  .drawer-foot{padding:18px 22px 24px;border-top:1px solid var(--line);}
  .total-row{display:flex;justify-content:space-between;font-size:14.5px;margin-bottom:4px;color:var(--text-muted);}
  .total-row.grand{font-size:18px;font-weight:800;color:var(--text);margin:10px 0 16px;}
  .checkout-btn{width:100%;background:linear-gradient(90deg,#22C168,var(--green));color:#06210F;border:none;padding:14px;border-radius:11px;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s ease, filter .2s ease;}
  .checkout-btn:hover:not(:disabled){filter:brightness(1.08);}
  .checkout-btn:active:not(:disabled){transform:scale(.98);}
  .checkout-btn:disabled{opacity:.4;}

  /* ---- Modal ---- */
  .modal-overlay{position:fixed;inset:0;background:rgba(6,5,10,.72);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s ease;z-index:60;padding:16px;}
  .modal-overlay.open{opacity:1;pointer-events:auto;}
  .modal{background:var(--bg-raise);border:1px solid var(--line);border-radius:18px;padding:28px;width:100%;max-width:400px;transform:scale(.96);transition:transform .25s ease;}
  .modal-overlay.open .modal{transform:scale(1);}
  .modal h3{margin:0 0 6px;font-size:19px;}
  .modal p.sub{color:var(--text-muted);font-size:13.5px;margin:0 0 20px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:13px;color:var(--text-muted);margin-bottom:6px;}
  .field input, .field textarea, .field select{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);padding:11px 13px;border-radius:9px;font-family:inherit;font-size:14.5px;transition:border-color .15s ease;}
  .field input:focus, .field textarea:focus, .field select:focus{border-color:var(--gold);}
  .field textarea{resize:vertical;min-height:62px;}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .modal-actions{display:flex;gap:10px;margin-top:18px;}
  .btn-secondary{flex:1;background:transparent;border:1px solid var(--line);color:var(--text-muted);padding:11px;border-radius:9px;font-weight:700;font-size:14.5px;}
  .btn-primary{flex:2;background:linear-gradient(90deg,#22C168,var(--green));color:#06210F;border:none;padding:11px;border-radius:9px;font-weight:800;font-size:14.5px;}

  /* ---- Product detail page ---- */
  .back-link{background:none;border:none;color:var(--text-muted);font-size:13.5px;font-weight:700;padding:22px 0 0;display:flex;align-items:center;gap:6px;}
  .back-link:hover{color:var(--gold-soft);}
  .product-page{padding:14px 0 60px;display:grid;grid-template-columns:1fr 1fr;gap:36px;align-items:start;}
  .product-media{position:relative;aspect-ratio:1/1;border-radius:20px;overflow:hidden;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:110px;background:radial-gradient(circle at 30% 30%, rgba(139,108,242,.35), transparent 60%), radial-gradient(circle at 75% 75%, rgba(232,185,35,.28), transparent 55%), #201C2E;}
  .product-media img{width:100%;height:100%;object-fit:cover;}
  .product-info .p-cat{color:var(--text-muted);font-size:13px;margin-bottom:6px;}
  .product-info h1{font-size:26px;margin:0 0 12px;}
  .product-info .p-price{color:var(--gold-soft);font-weight:800;font-size:24px;display:flex;align-items:center;gap:10px;margin-bottom:18px;}
  .product-info .p-price .old{color:var(--text-muted);font-weight:500;font-size:15px;text-decoration:line-through;}
  .specs-list{list-style:none;margin:0 0 24px;padding:0;display:flex;flex-direction:column;gap:0;border-top:1px solid var(--line);}
  .specs-list li{display:flex;justify-content:space-between;gap:14px;padding:11px 2px;border-bottom:1px solid var(--line);font-size:14px;}
  .specs-list li .k{color:var(--text-muted);}
  .specs-list li .v{font-weight:700;text-align:left;}
  .p-qty-row{display:flex;align-items:center;gap:16px;margin-bottom:16px;}
  .p-qty{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:6px 8px;}
  .p-qty button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:16px;}
  .p-qty button:hover{border-color:var(--gold);}
  .p-qty span{min-width:22px;text-align:center;font-weight:700;}
  .p-add-btn{background:var(--gold);color:#0E0D13;border:none;padding:13px 26px;border-radius:11px;font-weight:800;font-size:15px;transition:background .2s ease, transform .12s ease;}
  .p-add-btn:hover{background:var(--gold-soft);}
  .p-add-btn:active{transform:scale(.97);}
  @media(max-width:720px){
    .product-page{grid-template-columns:1fr;gap:22px;}
    .product-media{font-size:80px;}
  }

  footer{border-top:1px solid var(--line);padding:28px 0 44px;color:var(--text-muted);font-size:13.5px;text-align:center;}

  @media(max-width:520px){
    .hero{height:min(78vw,300px);}
    .slide{padding:0 26px;}
    .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:13px;}
  }
  @media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important;}}
</style>
</head>
<body>

<div id="storefront">

  <div class="strip"><span id="stripText">التوصيل مجاني على جميع الطلبات</span><span class="pulse"></span></div>

  <header>
    <div class="wrap">
      <div class="brand" id="brandName">متجر<span>ي</span></div>
      <div class="header-actions">
        <button class="cart-btn" id="cartToggle">
          🛍️ السلة <span class="cart-count" id="cartCount">0</span>
        </button>
      </div>
    </div>
  </header>

  <div class="wrap" id="storeHome">
    <div class="hero" id="hero">
      <div class="hero-dots" id="heroDots"></div>
      <button class="hero-arrow prev" id="prevSlide" aria-label="السابق">›</button>
      <button class="hero-arrow next" id="nextSlide" aria-label="التالي">‹</button>
    </div>

    <div class="trust">
      <div class="trust-item"><span class="ic">🚚</span> <b>توصيل مجاني</b> لكل الطلبات</div>
      <div class="trust-item"><span class="ic">💬</span> تأكيد الطلب <b>عبر واتساب</b></div>
      <div class="trust-item"><span class="ic">✅</span> جودة <b>مضمونة</b></div>
    </div>

    <div class="cats" id="cats"></div>
    <div class="grid" id="grid"></div>
  </div>

  <div class="wrap hidden" id="productPageWrap">
    <button class="back-link" id="backToStore">‹ رجوع للمتجر</button>
    <div class="product-page" id="productPage"></div>
  </div>

  <footer>
    للاستفسار أو الطلبات الخاصة تواصل معنا مباشرة عبر واتساب
  </footer>

  <div class="toast-stack" id="toastStack"></div>

  <div class="overlay" id="overlay"></div>
  <aside class="drawer" id="drawer">
    <div class="drawer-head">
      <h2>سلة الطلبات</h2>
      <button class="close-btn" id="closeDrawer">✕</button>
    </div>
    <div class="drawer-items" id="drawerItems"></div>
    <div class="drawer-foot">
      <div class="total-row"><span>عدد القطع</span><span id="totalQty">0</span></div>
      <div class="total-row grand"><span>المجموع</span><span id="totalPrice">0 د.ع</span></div>
      <button class="checkout-btn" id="checkoutBtn" disabled>إتمام الطلب عبر واتساب</button>
    </div>
  </aside>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h3>معلومات التوصيل</h3>
      <p class="sub">نحتاج بياناتك حتى نجهز طلبك ونتواصل معك على واتساب</p>
      <div class="field"><label for="custName">الاسم</label><input id="custName" type="text" placeholder="اسمك الكامل"></div>
      <div class="field"><label for="custPhone">رقم الهاتف</label><input id="custPhone" type="tel" placeholder="07xxxxxxxxx"></div>
      <div class="field"><label for="custAddress">عنوان التوصيل</label><textarea id="custAddress" placeholder="المحافظة، المنطقة، أقرب نقطة دالة"></textarea></div>
      <div class="modal-actions">
        <button class="btn-secondary" id="cancelModal">رجوع</button>
        <button class="btn-primary" id="sendOrder">إرسال الطلب</button>
      </div>
    </div>
  </div>

</div>

<script>
/* ============================================================
   القيم الافتراضية عند أول تشغيل — تُدار فعلياً من لوحة التحكم المنفصلة
   ============================================================ */
const DEFAULTS = {
  settings:{

let STATE = { settings:{...DEFAULTS.settings}, products:[...DEFAULTS.products], slides:[...DEFAULTS.slides], orders:[] };
let cart = {};
let activeCategory = "الكل";
let slideIndex = 0, slideTimer;

function fmt(n){ return Number(n).toLocaleString('en-US') + " د.ع"; }
function uid(){ return Date.now() + Math.floor(Math.random()*1000); }

/* ---------------- Storage helpers ---------------- */
/* نفس المفاتيح يشترك فيها ملف لوحة التحكم admin.html عن طريق Firestore،
   فأي تعديل من لوحة التحكم ينعكس على المتجر لكل الزوار مباشرة */
async function loadKey(key, fallback){
  try{
    const snap = await db.collection('store').doc(key).get();
    if(snap.exists && snap.data().json) return JSON.parse(snap.data().json);
    return fallback;
  }catch(e){
    console.error('load error', e);
    return fallback;
  }
}
async function saveKey(key, value){
  try{
    await db.collection('store').doc(key).set({ json: JSON.stringify(value) });
    return true;
  }catch(e){
    console.error('storage error', e);
    return false;
  }
}

async function loadAll(){
  /* الطلبات ما تنحمّل هنا: المتجر ما يحتاجها إلا وقت إرسال طلب جديد،
     وتحميلها لكل زائر كان يبطئ فتح الصفحة ويسرّب بيانات الزباين بلا داعي. */
  const [settings, products, slides] = await Promise.all([
    loadKey('settings', DEFAULTS.settings),
    loadKey('products', DEFAULTS.products),
    loadKey('slides', DEFAULTS.slides)
  ]);
  STATE.settings = settings;
  STATE.products = products;
  STATE.slides = slides;
}

/* ---------------- Storefront rendering ---------------- */
function renderBrandAndStrip(){
  document.getElementById('stripText').textContent = STATE.settings.stripText;
  document.getElementById('brandName').innerHTML =
    STATE.settings.storeName.length > 1
      ? STATE.settings.storeName.slice(0,-1) + '<span>' + STATE.settings.storeName.slice(-1) + '</span>'
      : '<span>' + STATE.settings.storeName + '</span>';
}

function renderHero(){
  const hero = document.getElementById('hero');
  const dotsWrap = document.getElementById('heroDots');
  hero.querySelectorAll('.slide').forEach(s=>s.remove());
  dotsWrap.innerHTML = '';
  STATE.slides.forEach((s,i)=>{
    const div = document.createElement('div');
    div.className = 'slide' + (i===0?' active':'');
    div.dataset.idx = i;
    div.innerHTML = `<div class="slide-content"><div class="slide-eyebrow">${s.eyebrow}</div><h2>${s.title}</h2><p>${s.desc}</p></div>`;
    hero.insertBefore(div, dotsWrap);
    const dot = document.createElement('button');
    if(i===0) dot.classList.add('active');
    dot.addEventListener('click', ()=>goToSlide(i));
    dotsWrap.appendChild(dot);
  });
  slideIndex = 0;
  resetTimer();
}
function goToSlide(i){
  const slides = document.querySelectorAll('#hero .slide');
  const dotsWrap = document.getElementById('heroDots');
  if(!slides.length) return;
  slides[slideIndex].classList.remove('active');
  dotsWrap.children[slideIndex].classList.remove('active');
  slideIndex = (i + slides.length) % slides.length;
  slides[slideIndex].classList.add('active');
  dotsWrap.children[slideIndex].classList.add('active');
  resetTimer();
}
function resetTimer(){
  clearInterval(slideTimer);
  slideTimer = setInterval(()=>goToSlide(slideIndex+1), 5000);
}
document.getElementById('nextSlide').addEventListener('click', ()=>goToSlide(slideIndex+1));
document.getElementById('prevSlide').addEventListener('click', ()=>goToSlide(slideIndex-1));

function categories(){ return ["الكل", ...new Set(STATE.products.map(p=>p.category))]; }
function renderCats(){
  const el = document.getElementById('cats');
  el.innerHTML = categories().map(c => `<button class="cat-pill ${c===activeCategory?'active':''}" data-cat="${c}">${c}</button>`).join('');
  el.querySelectorAll('.cat-pill').forEach(btn=>{
    btn.addEventListener('click', ()=>{ activeCategory = btn.dataset.cat; renderCats(); renderGrid(); });
  });
}

function renderGrid(){
  const el = document.getElementById('grid');
  const list = activeCategory === "الكل" ? STATE.products : STATE.products.filter(p=>p.category===activeCategory);
  if(list.length===0){ el.innerHTML = `<div class="empty-state">لا توجد منتجات بهذا التصنيف بعد</div>`; return; }
  el.innerHTML = list.map((p,i) => `
    <div class="card" style="animation-delay:${i*45}ms">
      <div class="card-media" data-id="${p.id}">
        ${p.tag ? `<span class="badge ${p.tag}">${p.tag==='sale' ? 'خصم' : 'جديد'}</span>` : ''}
        ${p.image ? `<img src="${p.image}" alt="${p.name}">` : `<span>${p.emoji || '📦'}</span>`}
      </div>
      <div class="card-body">
        <div class="card-cat">${p.category}</div>
        <p class="card-name" data-id="${p.id}">${p.name}</p>
        <div class="card-bottom">
          <span class="price">${fmt(p.price)}${p.oldPrice ? `<span class="old">${fmt(p.oldPrice)}</span>` : ''}</span>
          <button class="add-btn" data-id="${p.id}">أضف</button>
        </div>
      </div>
    </div>
  `).join('');
  el.querySelectorAll('.add-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = Number(btn.dataset.id);
      const product = STATE.products.find(p=>p.id===id);
      cart[id] = (cart[id]||0) + 1;
      showToast(`أُضيف "${product.name}" للسلة`);
      renderCart();
    });
  });
  el.querySelectorAll('.card-media, .card-name').forEach(node=>{
    node.addEventListener('click', ()=>{ goToProduct(Number(node.dataset.id)); });
  });
}

function showToast(text){
  const stack = document.getElementById('toastStack');
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `✓ ${text}`;
  stack.appendChild(t);
  setTimeout(()=>t.remove(), 2000);
}

function cartEntries(){
  return Object.entries(cart).filter(([,qty])=>qty>0)
    .map(([id,qty])=>({ product: STATE.products.find(p=>p.id===Number(id)), qty }))
    .filter(e=>e.product);
}

function renderCart(){
  const entries = cartEntries();
  const items = document.getElementById('drawerItems');
  const totalQty = entries.reduce((s,e)=>s+e.qty,0);
  const totalPrice = entries.reduce((s,e)=>s+e.qty*e.product.price,0);

  const countEl = document.getElementById('cartCount');
  countEl.textContent = totalQty;
  countEl.classList.remove('bump'); void countEl.offsetWidth; countEl.classList.add('bump');

  document.getElementById('totalQty').textContent = totalQty;
  document.getElementById('totalPrice').textContent = fmt(totalPrice);
  document.getElementById('checkoutBtn').disabled = totalQty === 0;

  if(entries.length === 0){
    items.innerHTML = `<div class="empty-cart"><span class="ic">🛍️</span>سلتك فارغة حالياً<br>أضف منتج عشان تبدأ طلبك</div>`;
    return;
  }
  items.innerHTML = entries.map(e => `
    <div class="line-item" data-id="${e.product.id}">
      <div class="line-media">${e.product.emoji || '📦'}</div>
      <div class="line-info"><div class="n">${e.product.name}</div><div class="p">${fmt(e.product.price)}</div></div>
      <div class="qty"><button class="minus">−</button><span>${e.qty}</span><button class="plus">+</button></div>
      <button class="remove-x" title="حذف">🗑️</button>
    </div>
  `).join('');
  items.querySelectorAll('.line-item').forEach(row=>{
    const id = Number(row.dataset.id);
    row.querySelector('.plus').addEventListener('click', ()=>{ cart[id]++; renderCart(); });
    row.querySelector('.minus').addEventListener('click', ()=>{ cart[id] = Math.max(0, cart[id]-1); renderCart(); });
    row.querySelector('.remove-x').addEventListener('click', ()=>{ cart[id] = 0; renderCart(); });
  });
}

/* ---------------- Product detail page ---------------- */
let productPageQty = 1;

function goToProduct(id){
  location.hash = `product-${id}`;
}

function specsToItems(specs){
  if(!specs) return [];
  return specs.split('\n').map(line=>line.trim()).filter(Boolean).map(line=>{
    const idx = line.indexOf(':');
    if(idx === -1) return { k:'', v:line };
    return { k:line.slice(0,idx).trim(), v:line.slice(idx+1).trim() };
  });
}

function renderProductPage(id){
  const product = STATE.products.find(p=>p.id===id);
  const wrap = document.getElementById('productPageWrap');
  if(!product){
    document.getElementById('storeHome').classList.remove('hidden');
    wrap.classList.add('hidden');
    return;
  }
  productPageQty = 1;
  const specItems = specsToItems(product.specs);
  document.getElementById('productPage').innerHTML = `
    <div class="product-media">
      ${product.image ? `<img src="${product.image}" alt="${product.name}">` : `<span>${product.emoji || '📦'}</span>`}
    </div>
    <div class="product-info">
      <div class="p-cat">${product.category}</div>
      <h1>${product.name}</h1>
      <div class="p-price">${fmt(product.price)}${product.oldPrice ? `<span class="old">${fmt(product.oldPrice)}</span>` : ''}</div>
      ${specItems.length ? `<ul class="specs-list">${specItems.map(s=>`<li><span class="k">${s.k||'—'}</span><span class="v">${s.v}</span></li>`).join('')}</ul>` : ''}
      <div class="p-qty-row">
        <div class="p-qty">
          <button id="pQtyMinus">−</button>
          <span id="pQtyVal">1</span>
          <button id="pQtyPlus">+</button>
        </div>
        <button class="p-add-btn" id="pAddToCart">أضف للسلة</button>
      </div>
    </div>
  `;
  document.getElementById('pQtyPlus').addEventListener('click', ()=>{
    productPageQty++; document.getElementById('pQtyVal').textContent = productPageQty;
  });
  document.getElementById('pQtyMinus').addEventListener('click', ()=>{
    productPageQty = Math.max(1, productPageQty-1); document.getElementById('pQtyVal').textContent = productPageQty;
  });
  document.getElementById('pAddToCart').addEventListener('click', ()=>{
    cart[product.id] = (cart[product.id]||0) + productPageQty;
    showToast(`أُضيف "${product.name}" للسلة`);
    renderCart();
  });

  document.getElementById('storeHome').classList.add('hidden');
  wrap.classList.remove('hidden');
  window.scrollTo({top:0, behavior:'instant' in window ? 'instant' : 'auto'});
}

function handleRoute(){
  const hash = location.hash.replace('#','');
  if(hash.startsWith('product-')){
    renderProductPage(Number(hash.replace('product-','')));
  }else{
    document.getElementById('productPageWrap').classList.add('hidden');
    document.getElementById('storeHome').classList.remove('hidden');
  }
}
document.getElementById('backToStore').addEventListener('click', ()=>{
  history.pushState('', document.title, window.location.pathname + window.location.search);
  handleRoute();
});
window.addEventListener('hashchange', handleRoute);

/* ---------------- Drawer / modal open-close ---------------- */
const drawer = document.getElementById('drawer');
const overlay = document.getElementById('overlay');
function openDrawer(){ drawer.classList.add('open'); overlay.classList.add('open'); }
function closeDrawer(){ drawer.classList.remove('open'); overlay.classList.remove('open'); }
document.getElementById('cartToggle').addEventListener('click', openDrawer);
document.getElementById('closeDrawer').addEventListener('click', closeDrawer);
overlay.addEventListener('click', ()=>{ closeDrawer(); closeModal(); });

const modalOverlay = document.getElementById('modalOverlay');
function openModal(){ modalOverlay.classList.add('open'); }
function closeModal(){ modalOverlay.classList.remove('open'); }
document.getElementById('checkoutBtn').addEventListener('click', openModal);
document.getElementById('cancelModal').addEventListener('click', closeModal);

document.getElementById('sendOrder').addEventListener('click', async ()=>{
  const name = document.getElementById('custName').value.trim();
  const phone = document.getElementById('custPhone').value.trim();
  const address = document.getElementById('custAddress').value.trim();
  if(!name || !phone || !address){ alert("لطفاً عبّي كل الحقول قبل إرسال الطلب"); return; }

  const entries = cartEntries();
  const totalPrice = entries.reduce((s,e)=>s+e.qty*e.product.price,0);

  let msg = `طلب جديد من المتجر:%0A%0A`;
  entries.forEach(e=>{ msg += `- ${e.product.name} × ${e.qty} = ${fmt(e.product.price*e.qty)}%0A`; });
  msg += `%0Aالمجموع: ${fmt(totalPrice)}%0Aالتوصيل: مجاني%0A%0Aالاسم: ${name}%0Aالهاتف: ${phone}%0Aالعنوان: ${address}`;

  window.open(`https://wa.me/${STATE.settings.whatsapp}?text=${msg}`, '_blank');

  /* نجيب قائمة الطلبات الحالية فقط الآن (وقت الإرسال)، مو من بداية فتح الصفحة */
  const currentOrders = await loadKey('orders', []);
  currentOrders.unshift({
    id: uid(),
    name, phone, address,
    items: entries.map(e=>({ name:e.product.name, qty:e.qty, price:e.product.price })),
    total: totalPrice,
    time: new Date().toISOString(),
    status: 'pending'
  });
  await saveKey('orders', currentOrders);

  closeModal(); closeDrawer();
  cart = {}; renderCart();
  document.getElementById('custName').value = "";
  document.getElementById('custPhone').value = "";
  document.getElementById('custAddress').value = "";
});

/* ---------------- Boot ---------------- */
function renderStorefront(){
  renderBrandAndStrip();
  renderHero();
  renderCats();
  renderGrid();
  renderCart();
  handleRoute();
}
(async function init(){
  renderStorefront(); /* يظهر فوراً بالقيم الافتراضية بدون أي واجهة تحميل */
  await loadAll();
  renderStorefront(); /* يتحدّث بالبيانات الحقيقية أول ما توصل */
})();
</script>
